<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>position</title>
    <style>
        div {
            width: 200px;
            height: 100px;
            margin: 10px;
            padding: 10px;
            border: 2px solid rgb(0, 0, 0);

        }

        .parent {
            position: relative;
            width: 100%;
            height: 200px;
        }

        .box {
            position: absolute;
            top: 10px;
            left: 10px;

        }

        .box1 {
            background-color: rgb(255, 73, 73);
        }

        .box2 {

            background-color: lightcyan;
        }

        .box3 {
            background-color: #f89ee0;

        }
    </style>
</head>

<body>
    <div class="parent">
        <div class="box1 box">Box 1(absolute)</div>
        <div class="box2 box">Box 2(absolute)</div>
        <div class="box3 box">Box 3(absolute)</div>
</body>

</html>
