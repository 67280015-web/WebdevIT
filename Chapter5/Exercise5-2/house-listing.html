<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>House Listing</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body>

    <!-- Container (Flexbox) -->
    <div class="listing-container">

        <!-- บ้านเดี่ยว -->
        <div class="house-card">
            <div class="card-image">
                <img src="https://images.pexels.com/photos/106399/pexels-photo-106399.jpeg" alt="บ้านเดี่ยว">
                <span class="badge">บ้านเดี่ยว</span>
            </div>
            <div class="card-content">
                <p class="price">3,500,000 บาท</p>
                <h2 class="title">Green Ville (บางนา)</h2>
                <p class="detail">3 ห้องนอน · 2 ห้องน้ำ</p>
            </div>
        </div>

        <!-- ทาวน์โฮม -->
        <div class="house-card">
            <div class="card-image">
                <img src="https://images.pexels.com/photos/259588/pexels-photo-259588.jpeg" alt="ทาวน์โฮม">
                <span class="badge">ทาวน์โฮม</span>
            </div>
            <div class="card-content">
                <p class="price">2,800,000 บาท</p>
                <h2 class="title">Town Plus</h2>
                <p class="detail">2 ห้องนอน · 2 ห้องน้ำ</p>
            </div>
        </div>
        
        <!-- บ้านแฝด -->
        <div class="house-card">
            <div class="card-image">
                <img src="https://images.pexels.com/photos/1396122/pexels-photo-1396122.jpeg" alt="บ้านแฝด">
                <span class="badge twin">บ้านแฝด</span>
            </div>
            <div class="card-content">
                <p class="price">3,200,000 บาท</p>
                <h2 class="title">Living Park</h2>
                <p class="detail">3 ห้องนอน · 2 ห้องน้ำ</p>
            </div>
            
        </div>
            <!-- Condominium -->
            <div class="house-card">
                <div class="card-image">
                    <img src="https://images.pexels.com/photos/323780/pexels-photo-323780.jpeg" alt="Condominium">
                    <span class="badge condo">Condominium</span>
                </div>
                <div class="card-content">
                    <p class="price">1,950,000 บาท</p>
                    <h2 class="title">Sky View Condo</h2>
                    <p class="detail">1 ห้องนอน · 1 ห้องน้ำ · ชั้น 12</p>
                </div>
            </div>


        </div>

    </div>

</body>

</html>
